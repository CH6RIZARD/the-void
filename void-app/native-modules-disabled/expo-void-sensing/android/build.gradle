apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

group = 'com.thevoid.sensing'
version = '0.1.0'

def safeExtGet(prop, fallback) {
  rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

// Apply the Expo Modules Core gradle plugin (provides useCoreDependencies /
// useExpoPublishing / applyKotlinExpoModulesCorePlugin).
apply from: project(':expo-modules-core').file("ExpoModulesCorePlugin.gradle")

applyKotlinExpoModulesCorePlugin()
useCoreDependencies()
useExpoPublishing()

android {
  namespace 'com.thevoid.sensing'
  compileSdkVersion safeExtGet('compileSdkVersion', 34)

  defaultConfig {
    minSdkVersion safeExtGet('minSdkVersion', 26)
    targetSdkVersion safeExtGet('targetSdkVersion', 34)
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = '17'
  }

  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation project(':expo-modules-core')

  // Kotlin coroutines (also transitively provided by expo-modules-core; pinned here
  // so the periodic evaluation loop compiles standalone).
  implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"

  // Encrypted, device-local persistence for baselines / consent / kill switch.
  implementation "androidx.security:security-crypto:1.1.0-alpha06"

  // CameraX — rear-camera + torch contact PPG (Tier 4).
  def cameraxVersion = "1.3.4"
  implementation "androidx.camera:camera-core:${cameraxVersion}"
  implementation "androidx.camera:camera-camera2:${cameraxVersion}"
  implementation "androidx.camera:camera-lifecycle:${cameraxVersion}"

  // Health Connect — read HR/HRV written by a paired wearable (Tier 1).
  implementation "androidx.health.connect:connect-client:1.1.0-alpha07"

  // Lifecycle (LifecycleOwner for CameraX binding).
  implementation "androidx.lifecycle:lifecycle-common:2.7.0"

  // TensorFlow Lite — OPTIONAL on-device affect model (T1.8). Loaded reflectively in
  // TFLiteAffectEstimator, so this line can be removed if no model ships; the module
  // then degrades to null affect output (the documented default).
  implementation "org.tensorflow:tensorflow-lite:2.14.0"
}
