# Play Store AAB for the native app (void-app), built on GitHub's runner with
# `eas build --local`. Local EAS builds don't consume the Expo cloud build quota,
# and they still sign with the project's existing remote Android keystore and
# bump the remote versionCode, so the result is upload-ready for Google Play.
#
# Run: GitHub → Actions → "Android AAB" → Run workflow (or `gh workflow run android-aab.yml`).
# Needs repo secret EXPO_TOKEN (expo.dev → Account settings → Access tokens).
# The .aab is attached to the run as the artifact "the-void-aab".
name: Android AAB

on:
  workflow_dispatch:
    inputs:
      profile:
        description: EAS build profile
        default: production
        required: true

# contents: write - preview APKs are published as release assets (see the last step).
permissions:
  contents: write

jobs:
  aab:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: void-app
    steps:
      - uses: actions/checkout@v4

      # A React Native release build needs room: the runner image ships ~20GB of
      # toolchains this job never uses, and the first attempt died mid-Gradle.
      # NOT the Android NDK - the native build needs it (deleting it failed a run).
      # NOT /usr/local/lib/node_modules either: the preinstalled yarn lives there.
      # The second line came with building expo-gl from source (package.json
      # buildFromSource): run 37235455411 compiled everything and then died copying
      # the finished APK - ENOSPC with 25GB free at the start.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/share/swift /usr/local/share/powershell "$AGENT_TOOLSDIRECTORY"/Ruby "$AGENT_TOOLSDIRECTORY"/PyPy || true
          sudo rm -rf /usr/local/.ghcup "$AGENT_TOOLSDIRECTORY"/CodeQL "$AGENT_TOOLSDIRECTORY"/go /usr/local/share/boost /usr/local/share/chromium /opt/microsoft /opt/google /opt/az /usr/share/az_* /usr/local/julia* /usr/local/aws-cli /usr/local/aws-sam-cli /usr/share/miniconda || true
          docker system prune -af > /dev/null 2>&1 || true
          df -h / /mnt

      # The C++ side (reanimated, expo-modules-core, worklets) OOM-killed the Gradle
      # daemon on a 16GB runner. 10GB of swap + fewer parallel compile jobs below.
      - name: Add swap
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 10G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # The ubuntu runner ships the Android SDK (ANDROID_HOME is preset). The
      # setup-android action broke: its default package list asks for the removed
      # 'tools' package, so sdkmanager exits 1.
      - name: Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Install EAS CLI
        run: npm install -g eas-cli

      # EAS cloud installs with yarn 1 (no lockfile is committed); match it.
      - name: Install dependencies
        run: yarn install --non-interactive --network-timeout 600000
      - name: Typecheck (fail fast - a broken import must never cost a 25-minute build)
        working-directory: void-app
        run: npx tsc --noEmit -p tsconfig.json
      # The dual-implementation strategy IS these tests; they rotted silently
      # for weeks when nothing ran them - never again.
      - name: Golden parity + variant tests
        working-directory: void-app
        run: npm test

      - name: Build AAB (local, signed with the remote keystore)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          NODE_OPTIONS: --max-old-space-size=6144
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx3g -Dorg.gradle.daemon=false -Dorg.gradle.workers.max=1 -Dorg.gradle.parallel=false
          # ninja/clang jobs: the default is one per core, which is what blew the RAM.
          CMAKE_BUILD_PARALLEL_LEVEL: "2"
          # Play needs 64-bit; arm64 + armv7 covers every phone. Dropping the x86
          # emulator ABIs roughly halves the native build. PREVIEW goes further:
          # it only ever side-loads onto the two arm64 test phones, and with
          # react-native-skia's native libs aboard, two ABIs killed the runner
          # logless twice (37154497378, 37157119544) despite the swap and the
          # capped workers above. One ABI halves packaging again.
          ORG_GRADLE_PROJECT_reactNativeArchitectures: ${{ inputs.profile == 'preview' && 'arm64-v8a' || 'arm64-v8a,armeabi-v7a' }}
        run: |
          # preview builds an installable APK; production builds an AAB for Play.
          # Naming the output .aab either way produced an APK called the-void.aab.
          ext=aab; [ "${{ inputs.profile }}" = preview ] && ext=apk
          echo "EXT=$ext" >> "$GITHUB_ENV"
          eas build -p android --profile "${{ inputs.profile }}" --local --non-interactive --output "$GITHUB_WORKSPACE/the-void.$ext"

      # The artifact store is a quota the 90 MB test APKs exhausted (2026-10-05:
      # 'Artifact storage quota has been hit' failed eight finished builds at this
      # step). Kept short-lived and non-fatal; the APK of a preview build ships as a
      # prerelease asset instead, which that quota does not count.
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: the-void-${{ env.EXT }}
          path: the-void.${{ env.EXT }}
          if-no-files-found: error
          retention-days: 3

      - name: Publish preview APK as a prerelease asset
        if: inputs.profile == 'preview'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "apk-${{ github.run_id }}" "the-void.${{ env.EXT }}" --prerelease --target "${{ github.sha }}" --title "preview ${{ github.ref_name }} ${{ github.sha }}" --notes "Preview APK from run ${{ github.run_id }} (${{ github.ref_name }} @ ${{ github.sha }})."
